    status: accepted
    promptVersion: gen-v3
    stem: >-
      Venkatraman's article on Netflix argues that the company's first decade of success in
      mail-order rentals should have trapped it. What does the article say the trap was?
    options:
      - key: A
        text: >-
          Relying on its recommendation engine, the analytics competency it had built alongside its
          distribution network
      - key: B
        text: >-
          Building its future around shipping and distribution, the skill that its first decade had
          perfected
      - key: C
        text: >-
          Betting on a rival's cloud, which left its streaming service dependent on a potential
          competitor
      - key: D
        text: >-
          Commissioning shows from pilots and sampling, the outmoded model that its data should have
          replaced
    answer: B
    feedback:
      correct: >-
        The article's claim is that a decade of success in warehousing and shipping invited Netflix
        to treat those skills as its identity. The company instead abandoned a working model for
        streaming, which the author calls preserving the core while creating the new, and warns that
        past success guarantees nothing.
      A: >-
        The article treats the recommendation work as the capability Netflix carried forward, not as
        the trap it escaped.
      C: >-
        The article presents the Amazon Web Services decision as a deliberate strength of the
        streaming era, not as the trap of the rental era.
      D: >-
        Pilots and sampling are how the article says other studios still decide. Netflix is the
        contrast case, not the example.
